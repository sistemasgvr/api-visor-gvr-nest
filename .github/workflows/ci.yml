name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install
        run: npm ci
      - name: Lint (código nuevo; el lint completo del repo aún arrastra deuda)
        run: npm run lint:ci
      - name: Unit tests
        run: npm run test
      - name: E2E tests
        run: npm run test:e2e
      - name: Build
        run: npm run build
